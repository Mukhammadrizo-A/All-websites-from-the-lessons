<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <nav>
        <a href="../../index.html">Home</a>
    </nav>
    <main>
        <div class="boxes">
            <div id="box" class="box_1"></div>
            <h2>
                <span>R = red colour</span>
                <br>
                <span>G = green colour</span>
                <br><br>
                <span>Ctrl + Q = delate box</span>
                <br>
                <span>Alt + X = return box</span>
            </h2>
        </div>
        <div class="boxes">
            <h1 id="text1">Text - 1</h1>
            <h2>
                <span>Alt + A = Animation activation</span>
                <br><br>
                <span>Ctr + Y = Animation deactivation</span>
            </h2>
        </div>
        <div class="boxes">
            <h1 id="text2">Text - 2</h1>
            <h2>
                <span>+ = Increase size</span>
                <br><br>
                <span>- = Decrease size</span>
            </h2>
        </div>
        <div class="boxes">
            <div id="box1" class="box_2">
                <h2 id="txt1">Code</h2>
            </div>
            <div id="box2" class="box_2">
                <h2>AltKey</h2>
            </div>
            <div id="box3" class="box_2">
                <h2>CtrlKey</h2>
            </div>
            <div id="box4" class="box_2">
                <h2 id="txt2">Key</h2>
            </div>
        </div>
    </main>
</body>
</html>
